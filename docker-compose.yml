# ──────────────────────────────────────────────────────────────
# Aperture AI Gateway — Docker Compose (Local Development)
# ──────────────────────────────────────────────────────────────
# Usage:
#   cp .env.example .env     # fill in your API keys
#   docker-compose up --build
#
# Services:
#   gateway       → http://localhost:8080  (FastAPI AI gateway)
#   redis         → localhost:6379         (budget enforcement)
#   kafka         → localhost:9092         (usage event streaming)
#   dynamodb-local→ localhost:8001         (keys, budgets, usage)
# ──────────────────────────────────────────────────────────────

services:
  # ── FastAPI Gateway (Person A) ──────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aperture-gateway
    ports:
      - "8080:8000"    # Host 8080 → Container 8000 (avoids DynamoDB port collision)
    volumes:
      - .:/app         # Hot-reload: code changes reflected without rebuild
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKER=kafka:9092
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_started
      dynamodb-local:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Redis (Budget Enforcement Hot Path) ─────────────────────
  redis:
    image: redis:7-alpine
    container_name: aperture-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Kafka in KRaft Mode (No Zookeeper) ──────────────────────
  # Usage event streaming — Person C's consumer reads from here
  kafka:
    image: apache/kafka:latest
    container_name: aperture-kafka
    ports:
      - "9092:9092"    # Internal listener (container-to-container, e.g. gateway)
      - "9093:9093"    # External listener (host access: scripts, local consumer)
    environment:
      # KRaft mode settings (no Zookeeper needed)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Dual-listener setup:
      #   INTERNAL → used by gateway/consumer containers (advertises kafka:9092)
      #   EXTERNAL → used by host-side scripts (advertises localhost:9093)
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single-node dev settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Required for KRaft — fixed ID for local dev
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM1Tk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── DynamoDB Local (Keys, Budgets, Usage Aggregates) ────────
  # Person B's key/budget storage, Person C's usage aggregates
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: aperture-dynamodb
    ports:
      - "8001:8000"    # Host 8001 → Container 8000 (8000 is taken by SSH tunnel on this machine)
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]

volumes:
  redis_data:
  dynamodb_data:

